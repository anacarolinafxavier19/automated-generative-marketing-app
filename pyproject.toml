[project]
name = "marketing-app"
version = "0.1.0"
description = "Automated generative marketing collateral prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "sqlmodel>=0.0.21",
    "google-genai>=1.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "langsmith>=0.1.0",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "reportlab>=4.2",
    "pillow>=10.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
